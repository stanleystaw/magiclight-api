name: MagicLight Video Generator

on:
  repository_dispatch:
    types: [generate-video]
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID"
        required: true
        default: "manual_test_1"
      prompt:
        description: "Video Prompt / Story"
        required: true
        default: "Un jeune aventurier courageux avec une cape rouge découvre un grimoire magique"
      initial_image:
        description: "Initial Character Image URL"
        required: false
        default: ""
      sections:
        description: "Number of sections (2 to 10)"
        required: false
        default: "6"
      quality:
        description: "Quality (low, medium, high)"
        required: false
        default: "medium"
      duration:
        description: "Duration per section (5 or 10)"
        required: false
        default: "10"
      ratio:
        description: "Ratio (1 for 16:9, 2 for 9:16)"
        required: false
        default: "1"
      language:
        description: "Language"
        required: false
        default: "french"

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python & Pillow (1s)
        run: pip install pillow --break-system-packages || pip install pillow

      - name: Setup Full FFmpeg & FFprobe (1.5s)
        run: |
          curl -sL https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffmpeg-6.1-linux-64.zip -o /tmp/ff.zip && unzip -o -q /tmp/ff.zip -d /tmp/ && sudo cp /tmp/ffmpeg /usr/local/bin/ && sudo chmod +x /usr/local/bin/ffmpeg
          curl -sL https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffprobe-6.1-linux-64.zip -o /tmp/ffp.zip && unzip -o -q /tmp/ffp.zip -d /tmp/ && sudo cp /tmp/ffprobe /usr/local/bin/ && sudo chmod +x /usr/local/bin/ffprobe

      - name: Run Video Rendering Engine
        env:
          TASK_ID: ${{ github.event.client_payload.task_id || github.event.inputs.task_id }}
          PROMPT: ${{ github.event.client_payload.prompt || github.event.inputs.prompt }}
          INITIAL_IMAGE: ${{ github.event.client_payload.initial_image || github.event.inputs.initial_image || '' }}
          SECTIONS: ${{ github.event.client_payload.sections || github.event.inputs.sections || '6' }}
          QUALITY: ${{ github.event.client_payload.quality || github.event.inputs.quality || 'medium' }}
          DURATION: ${{ github.event.client_payload.duration || github.event.inputs.duration || '10' }}
          RATIO: ${{ github.event.client_payload.ratio || github.event.inputs.ratio || '1' }}
          LANGUAGE: ${{ github.event.client_payload.language || github.event.inputs.language || 'french' }}
          TURSO_DATABASE_URL: "https://magicligth-stanleystawa354.aws-eu-west-1.turso.io"
          TURSO_AUTH_TOKEN: "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODY1NDMwODcsImlkIjoiMDE5ZmY2NDMtZmEwMS03NzBkLWE3YjgtMWFkMDQzOWEzN2Q0Iiwia2lkIjoiRUowd0tEaER4WmxUYlZ5MHJLX1VRRnhGZml6NF9nTEp2WXBPdFdiQlM2USIsInJpZCI6ImYzNDE1MGEzLTJkMzMtNDBjOC05ZmFmLWViMDBhODFhOGFhMiJ9.DVj4IWSi5WgU1frG8BVvUmINQYQRN77Kqe0-GLT2qgTv_w6M4ccKOP-GsEkNnaL3jX7Ikb4g7Eo45llVcQAgBQ"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/render-video.js

      - name: Auto Refund and Notify Turso DB on Failure
        if: failure()
        env:
          TASK_ID: ${{ github.event.client_payload.task_id || github.event.inputs.task_id }}
          TURSO_DATABASE_URL: "https://magicligth-stanleystawa354.aws-eu-west-1.turso.io"
          TURSO_AUTH_TOKEN: "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODY1NDMwODcsImlkIjoiMDE5ZmY2NDMtZmEwMS03NzBkLWE3YjgtMWFkMDQzOWEzN2Q0Iiwia2lkIjoiRUowd0tEaER4WmxUYlZ5MHJLX1VRRnhGZml6NF9nTEp2WXBPdFdiQlM2USIsInJpZCI6ImYzNDE1MGEzLTJkMzMtNDBjOC05ZmFmLWViMDBhODFhOGFhMiJ9.DVj4IWSi5WgU1frG8BVvUmINQYQRN77Kqe0-GLT2qgTv_w6M4ccKOP-GsEkNnaL3jX7Ikb4g7Eo45llVcQAgBQ"
        run: |
          node -e "
            const turso = require('./lib/turso');
            const taskId = process.env.TASK_ID;
            if (taskId) {
              turso.execute('SELECT user_key, credits_deducted, refunded FROM video_tasks WHERE task_id = ?;', [taskId])
                .then(async (rows) => {
                  if (rows && rows.length && rows[0].user_key && parseInt(rows[0].credits_deducted || 0, 10) > 0 && parseInt(rows[0].refunded || 0, 10) !== 1) {
                    const refundAmt = parseInt(rows[0].credits_deducted, 10);
                    await turso.execute('UPDATE users SET credits = credits + ?, updated_at = CURRENT_TIMESTAMP WHERE api_key = ?;', [refundAmt, rows[0].user_key]);
                    console.log('Successfully refunded', refundAmt, 'credits to user key:', rows[0].user_key);
                  }
                  await turso.execute('UPDATE video_tasks SET status=\"failed\", progress=0, step=\"error\", refunded=1, message=\"Échec du rendu vidéo (Crédits remboursés automatiquement)\", error=\"Le workflow de rendu a échoué.\", updated_at=CURRENT_TIMESTAMP WHERE task_id=?;', [taskId]);
                  console.log('Successfully updated task status to failed:', taskId);
                })
                .catch((e) => console.warn('Could not notify Turso DB:', e.message));
            }
          "
